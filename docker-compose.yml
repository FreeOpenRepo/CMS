services:
  cms-db:
    image: postgres:18-alpine
    container_name: cms-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=cms_db
    ports:
      - "5432:5432"
    volumes:
      - cms_postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - cms-network

  cms-api:
    build:
      context: ./cms-api
      dockerfile: Dockerfile
    container_name: cms-api
    ports:
      - "5030:5030"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5030
      - ConnectionStrings__PostgresConnection=Host=cms-db;Port=5432;Database=cms_db;Username=postgres;Password=postgres
    depends_on:
      cms-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cms-network

  cms-web:
    build:
      context: ./cms-web
      dockerfile: Dockerfile
    container_name: cms-web
    ports:
      - "3003:3003"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5030
    depends_on:
      - cms-api
    restart: unless-stopped
    networks:
      - cms-network

volumes:
  cms_postgres_data:

networks:
  cms-network:
    driver: bridge

